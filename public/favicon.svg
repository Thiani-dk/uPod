<!-- uPod's NoteMark on the brand gradient — geometry copied from
     src/components/NoteMark.jsx, colours from the launcher icon
     (see scripts/generate-brand-assets.mjs). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#EC4899" />
      <stop offset="1" stop-color="#5E1D3D" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#brand)" />
  <g transform="translate(138 128) scale(0.492)" fill="#FFFFFF">
    <ellipse cx="105" cy="90" rx="98" ry="60" transform="rotate(-18 105 90)" />
    <ellipse cx="378" cy="64" rx="92" ry="58" transform="rotate(-18 378 64)" />
    <polygon points="40,98 80,82 80,458 40,472" />
    <polygon points="306,70 346,54 346,432 306,446" />
    <polygon points="40,472 346,432 346,396 40,436" />
  </g>
</svg>
